# Qwen3.5 execution, original E4M3FN weights, BF16 activations and FP32 accumulation/state.
backend: cuda

vision:
  - op: ImagePatchPreprocess
    source: vision_source
    pixel_count: pixels
    source_width_pixels: resized_width
    source_height_pixels: resized_height
    input_width_pixels: input_width
    input_height_pixels: input_height
    is_letterbox: false
    is_pillow_resize: true
    patch_size: patch_size
    destination: vision_patches
  - op: PairedPatchEmbedding
    input: vision_patches
    first_weight: v.patch_embd.weight
    second_weight: v.patch_embd.weight.1
    bias: v.patch_embd.bias
    height: resized_height
    width: resized_width
    channels: 3
    output_channels: v_hidden
    spatial_patch: patch_size
    output: vision_patch_embedding
  - op: GridPositionEmbedding
    input: vision_patch_embedding
    position_weight: v.position_embd.weight
    grid_height: grid_height
    grid_width: grid_width
    position_grid_size: position_grid_size
    hidden_size: v_hidden
    merge_size: merge_size
    output: vision_hidden
  - repeat: vision_layers
    as: vision_layer
    body:
      - op: LayerNorm
        input: vision_hidden
        weight: "v.blk.{vision_layer}.ln1.weight"
        bias: "v.blk.{vision_layer}.ln1.bias"
        rows: v_tokens
        hidden_size: v_hidden
        epsilon: v_epsilon
        output: vision_normalized
      - op: Linear
        input: vision_normalized
        weight: "v.blk.{vision_layer}.attn_qkv.weight"
        bias: "v.blk.{vision_layer}.attn_qkv.bias"
        is_float_bias: false
        rows: v_tokens
        inner: v_hidden
        columns: v_qkv
        output: vision_qkv
      - op: GridQkvRope
        qkv: vision_qkv
        token_count: v_tokens
        grid_height: grid_height
        grid_width: grid_width
        merge_size: merge_size
        head_count: v_heads
        head_size: v_head_size
        query: vision_query
        key: vision_key
        value: vision_value
      - op: Attention
        query: vision_query
        key_cache: vision_key
        value_cache: vision_value
        query_token_count: v_tokens
        query_head_count: v_heads
        key_value_head_count: v_heads
        cached_token_count: v_tokens
        start_position: 0
        head_dim: v_head_size
        is_causal: false
        output: vision_attention
      - op: Linear
        input: vision_attention
        weight: "v.blk.{vision_layer}.attn_out.weight"
        bias: "v.blk.{vision_layer}.attn_out.bias"
        is_float_bias: false
        rows: v_tokens
        inner: v_hidden
        columns: v_hidden
        output: vision_projected
      - op: Add
        lhs: vision_projected
        rhs: vision_hidden
        element_count: v_hidden_values
        output: vision_residual
      - op: LayerNorm
        input: vision_residual
        weight: "v.blk.{vision_layer}.ln2.weight"
        bias: "v.blk.{vision_layer}.ln2.bias"
        rows: v_tokens
        hidden_size: v_hidden
        epsilon: v_epsilon
        output: vision_normalized
      - op: Linear
        input: vision_normalized
        weight: "v.blk.{vision_layer}.ffn_up.weight"
        bias: "v.blk.{vision_layer}.ffn_up.bias"
        is_float_bias: false
        rows: v_tokens
        inner: v_hidden
        columns: v_ffn
        output: vision_feed_forward
      - op: GeluBias
        input: vision_feed_forward
        element_count: v_ffn_values
        row_size: v_ffn
        is_approximate: true
        output: vision_feed_forward
      - op: Linear
        input: vision_feed_forward
        weight: "v.blk.{vision_layer}.ffn_down.weight"
        bias: "v.blk.{vision_layer}.ffn_down.bias"
        is_float_bias: false
        rows: v_tokens
        inner: v_ffn
        columns: v_hidden
        output: vision_projected
      - op: Add
        lhs: vision_projected
        rhs: vision_residual
        element_count: v_hidden_values
        output: vision_hidden
  - op: LayerNorm
    input: vision_hidden
    weight: v.post_ln.weight
    bias: v.post_ln.bias
    rows: v_tokens
    hidden_size: v_hidden
    epsilon: v_epsilon
    output: vision_normalized
  - op: Linear
    input: vision_normalized
    weight: mm.0.weight
    bias: mm.0.bias
    is_float_bias: false
    rows: merged_tokens
    inner: merged_hidden
    columns: merged_hidden
    output: vision_qkv
  - op: GeluBias
    input: vision_qkv
    element_count: merged_values
    row_size: merged_hidden
    is_approximate: false
    output: vision_qkv
  - op: Linear
    input: vision_qkv
    weight: mm.2.weight
    bias: mm.2.bias
    is_float_bias: false
    rows: merged_tokens
    inner: merged_hidden
    columns: projection_size
    output: image_embedding

embedding:
  - op: QuantizedEmbedding
    indices: token_input
    weight: token_embd.weight
    weight_type: token_embd.weight.type
    token_count: tokens
    hidden_size: hidden_size
    vocabulary_size: vocabulary
    output: hidden

language:
  - repeat: language_layers
    as: layer
    body:
      - op: RmsNorm
        input: hidden
        weight: "blk.{layer}.attn_norm.weight"
        is_float_weight: true
        rows: tokens
        hidden_size: hidden_size
        epsilon: epsilon
        output: normalized
      - when: is_recurrent
        body:
          - op: Fp8Linear
            input: normalized
            weight: "blk.{layer}.attn_qkv.weight"
            weight_scales: "blk.{layer}.attn_qkv.weight_scale_inv"
            rows: tokens
            inner: hidden_size
            columns: recurrent_channels
            output: qkv
          - op: Fp8Linear
            input: normalized
            weight: "blk.{layer}.attn_gate.weight"
            weight_scales: "blk.{layer}.attn_gate.weight_scale_inv"
            rows: tokens
            inner: hidden_size
            columns: recurrent_size
            output: z
          - op: Linear
            input: normalized
            weight: "blk.{layer}.ssm_alpha.weight"
            rows: tokens
            inner: hidden_size
            columns: recurrent_heads
            output: alpha
          - op: Linear
            input: normalized
            weight: "blk.{layer}.ssm_beta.weight"
            rows: tokens
            inner: hidden_size
            columns: recurrent_heads
            output: beta
          - op: CausalConv1d
            input: qkv
            weight: "blk.{layer}.ssm_conv1d.weight"
            state: convolution_state
            token_count: tokens
            channels: recurrent_channels
            kernel_size: conv_size
            output: convolved
          - op: GatedDeltaNet
            is_chunked: true
            is_log_decay: true
            qkv: convolved
            alpha: alpha
            beta: beta
            decay_weight: "blk.{layer}.ssm_a_log"
            time_bias: "blk.{layer}.ssm_dt.bias"
            state: recurrent_state
            token_count: tokens
            key_head_count: recurrent_key_heads
            value_head_count: recurrent_heads
            head_size: recurrent_head_size
            epsilon: epsilon
            output: delta
          - op: RmsNorm
            input: delta
            weight: "blk.{layer}.ssm_norm.weight"
            rows: recurrent_rows
            hidden_size: recurrent_head_size
            epsilon: epsilon
            output: delta_normed
          - op: SwiGLU
            gate: z
            is_float_gate: true
            up: delta_normed
            element_count: recurrent_values
            output: delta_normed
          - op: Fp8Linear
            input: delta_normed
            weight: "blk.{layer}.ssm_out.weight"
            weight_scales: "blk.{layer}.ssm_out.weight_scale_inv"
            block_reduction_groups: recurrent_groups
            rows: tokens
            inner: recurrent_size
            columns: hidden_size
            output: projected
      - when: is_full_attention
        body:
          - op: Fp8Linear
            input: normalized
            weight: "blk.{layer}.attn_q.weight"
            weight_scales: "blk.{layer}.attn_q.weight_scale_inv"
            rows: tokens
            inner: hidden_size
            columns: query_gate_size
            output: qg
          - op: Fp8Linear
            input: normalized
            weight: "blk.{layer}.attn_k.weight"
            weight_scales: "blk.{layer}.attn_k.weight_scale_inv"
            rows: tokens
            inner: hidden_size
            columns: kv_size
            output: key
          - op: Fp8Linear
            input: normalized
            weight: "blk.{layer}.attn_v.weight"
            weight_scales: "blk.{layer}.attn_v.weight_scale_inv"
            rows: tokens
            inner: hidden_size
            columns: kv_size
            output: value
          - op: SplitGatedQuery
            query_gate: qg
            token_count: tokens
            head_count: query_heads
            head_size: head_size
            query: query
            gate: attention_gate
          - op: RmsNorm
            input: query
            weight: "blk.{layer}.attn_q_norm.weight"
            is_float_weight: true
            rows: query_rows
            hidden_size: head_size
            epsilon: epsilon
            output: query_normed
          - op: RmsNorm
            input: key
            weight: "blk.{layer}.attn_k_norm.weight"
            is_float_weight: true
            rows: kv_rows
            hidden_size: head_size
            epsilon: epsilon
            output: key_normed
          - op: PartialMultiAxisRope
            query: query_normed
            key: key_normed
            position_ids: positions
            tokens: tokens
            query_heads: query_heads
            key_value_heads: kv_heads
            head_dim: head_size
            rotary_dim: rotary_size
            temporal_section: rope_t
            height_section: rope_h
            width_section: rope_w
            frequency_base: rope_base
            query_output: query
            key_output: key
          - op: StoreKvCache
            key: key
            value: value
            token_count: tokens
            key_value_size: kv_size
            start_position: start_position
            cache_capacity: capacity
            key_cache: key_cache
            value_cache: value_cache
            cache_position: attention_position
          - op: Attention
            query: query
            key_cache: key_cache
            value_cache: value_cache
            query_token_count: tokens
            query_head_count: query_heads
            key_value_head_count: kv_heads
            cached_token_count: cached_tokens
            start_position: start_position
            head_dim: head_size
            is_causal: true
            output: attention
            decode_partials: decode_partials
            cache_position: attention_position
          - op: SigmoidGate
            input: attention
            gate: attention_gate
            element_count: query_values
            output: attention
          - op: Fp8Linear
            input: attention
            weight: "blk.{layer}.attn_output.weight"
            weight_scales: "blk.{layer}.attn_output.weight_scale_inv"
            rows: tokens
            inner: query_size
            columns: hidden_size
            output: projected
      - op: ResidualRmsNorm
        input: projected
        residual: hidden
        weight: "blk.{layer}.post_attention_norm.weight"
        is_float_weight: true
        rows: tokens
        hidden_size: hidden_size
        epsilon: epsilon
        residual_output: residual
        output: normalized
      - op: Fp8Linear
        input: normalized
        weight: "blk.{layer}.ffn_gate.weight"
        weight_scales: "blk.{layer}.ffn_gate.weight_scale_inv"
        rows: tokens
        inner: hidden_size
        columns: ffn_size
        output: gate
      - op: Fp8Linear
        input: normalized
        weight: "blk.{layer}.ffn_up.weight"
        weight_scales: "blk.{layer}.ffn_up.weight_scale_inv"
        rows: tokens
        inner: hidden_size
        columns: ffn_size
        output: up
      - op: SwiGLU
        gate: gate
        up: up
        element_count: ffn_values
        output: gate
      - op: Fp8Linear
        input: gate
        weight: "blk.{layer}.ffn_down.weight"
        weight_scales: "blk.{layer}.ffn_down.weight_scale_inv"
        rows: tokens
        inner: ffn_size
        columns: hidden_size
        output: projected
      - op: Add
        lhs: projected
        rhs: residual
        element_count: hidden_values
        output: hidden

sampling:
  - op: RmsNorm
    input: last_hidden
    weight: output_norm.weight
    is_float_weight: true
    rows: 1
    hidden_size: hidden_size
    epsilon: epsilon
    output: normalized
  - op: Linear
    input: normalized
    weight: output.weight
    rows: 1
    inner: hidden_size
    columns: vocabulary
    output: logits
  - op: Argmax
    logits: logits
    rows: 1
    columns: vocabulary
    output: sample

decode:
  - op: AdvanceSequence
    positions: positions
    cache_position: cache_position
